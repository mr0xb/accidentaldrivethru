name: Update incidents

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 9:17am Columbus time (13:17 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull new incidents from the 614NOW feed
        run: python3 scripts/update_incidents.py

      - name: Geocode anything new
        run: python3 scripts/geocode.py

      - name: Rebuild index.html
        run: python3 scripts/build.py

      - name: Redraw the share card
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make_og.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "incident bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/geo.json index.html assets/og.png
          git commit -m "Another one ($(date -u +%Y-%m-%d))"
          git push
